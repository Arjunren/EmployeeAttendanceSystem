services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: attendance, POSTGRES_USER: attendance, POSTGRES_PASSWORD: attendance }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U attendance"], interval: 5s, timeout: 5s, retries: 10 }
    volumes: [attendance_data:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://attendance:attendance@db:5432/attendance
      JWT_SECRET: local-development-secret-change-me-1234
      ALLOWED_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  migrate:
    build: .
    command: ["python", "-m", "app.migrate"]
    environment: { DATABASE_URL: postgresql+psycopg://attendance:attendance@db:5432/attendance, JWT_SECRET: local-development-secret-change-me-1234 }
    depends_on: { db: { condition: service_healthy } }
    profiles: [tools]
  seed:
    build: .
    command: ["python", "-m", "app.seed"]
    environment: { DATABASE_URL: postgresql+psycopg://attendance:attendance@db:5432/attendance, JWT_SECRET: local-development-secret-change-me-1234 }
    depends_on: { db: { condition: service_healthy } }
    profiles: [tools]
volumes: { attendance_data: {} }
